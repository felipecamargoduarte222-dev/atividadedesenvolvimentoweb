<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Loja Virtual: API Hunters</title>
<style>

body {
	margin: 0;
	padding: 0;
	font-family: Arial, Helvetica, sans-serif;
	background-color: #e9e9e9;
	color: #333333;
}

#topo {
	background-color: #4d4d4d;
	color: #ffffff;
	padding: 15px 0;
	text-align: center;
	border-bottom: 4px solid #333333;
}

#topo h1 {
	margin: 0;
	font-size: 26px;
}

#topo p {
	margin: 5px 0 0 0;
	font-size: 13px;
	color: #cccccc;
}

#container {
	width: 960px;
	margin: 0 auto;
	padding: 20px 0;
}

#barra-busca {
	background-color: #ffffff;
	border: 1px solid #bbbbbb;
	padding: 12px;
	margin-bottom: 20px;
	text-align: center;
}

#barra-busca input[type="text"] {
	width: 300px;
	padding: 6px;
	border: 1px solid #999999;
	font-size: 14px;
}

#barra-busca select {
	padding: 6px;
	border: 1px solid #999999;
	font-size: 14px;
	margin-left: 10px;
}

#barra-busca button {
	padding: 6px 14px;
	background-color: #666666;
	color: #ffffff;
	border: 1px solid #444444;
	cursor: pointer;
	font-size: 14px;
	margin-left: 10px;
}

#barra-busca button:hover {
	background-color: #555555;
}

#status {
	text-align: center;
	padding: 20px;
	font-size: 15px;
	color: #666666;
}

#grade-produtos {
	display: grid;
	grid-template-columns: repeat(4, 1fr);
	gap: 15px;
}

.card-produto {
	background-color: #ffffff;
	border: 1px solid #cccccc;
	padding: 12px;
	text-align: center;
	box-sizing: border-box;
}

.card-produto img {
	width: 120px;
	height: 120px;
	object-fit: contain;
	margin-bottom: 8px;
}

.card-produto h3 {
	font-size: 13px;
	height: 48px;
	overflow: hidden;
	margin: 5px 0;
}

.card-produto .categoria {
	font-size: 11px;
	color: #888888;
	text-transform: uppercase;
	margin-bottom: 6px;
}

.card-produto .preco {
	font-size: 16px;
	font-weight: bold;
	color: #2e6b2e;
	margin-bottom: 8px;
}

.card-produto button {
	background-color: #4d4d4d;
	color: #ffffff;
	border: none;
	padding: 6px 10px;
	cursor: pointer;
	font-size: 12px;
	width: 100%;
}

.card-produto button:hover {
	background-color: #333333;
}

#rodape {
	text-align: center;
	padding: 15px;
	font-size: 12px;
	color: #888888;
	border-top: 1px solid #cccccc;
	margin-top: 30px;
}

</style>
</head>
<body>

<div id="topo">
	<h1>Loja Virtual</h1>
	<p>Projeto API Hunters: usando a DummyJSON API</p>
</div>

<div id="container">

	<div id="barra-busca">
		<input type="text" id="campo-busca" placeholder="Buscar produto pelo nome...">
		<select id="filtro-categoria">
			<option value="todas">Todas as categorias</option>
		</select>
		<button id="btn-buscar">Buscar</button>
		<button id="btn-limpar">Limpar</button>
	</div>

	<div id="status"></div>

	<div id="grade-produtos"></div>

</div>

<div id="rodape">
	Loja Virtual - dados fornecidos pela dummyjson.com
	<br><br>
	Feito por Gustavo Henrique e Felipe Camargo - FEMA
</div>

<script>

var listaProdutos = [];

var elGrade = document.getElementById("grade-produtos");
var elStatus = document.getElementById("status");
var elBusca = document.getElementById("campo-busca");
var elCategoria = document.getElementById("filtro-categoria");
var elBotaoBuscar = document.getElementById("btn-buscar");
var elBotaoLimpar = document.getElementById("btn-limpar");

async function carregarProdutos() {
	elStatus.textContent = "Carregando produtos...";
	elGrade.innerHTML = "";

	try {
		var resposta = await fetch("https://dummyjson.com/products?limit=100");

		if (!resposta.ok) {
			throw new Error("Erro na resposta da API");
		}

		var dados = await resposta.json();
		listaProdutos = dados.products;

		montarCategorias(listaProdutos);
		mostrarProdutos(listaProdutos);
		elStatus.textContent = "";

	} catch (erro) {
		console.log(erro);
		elStatus.textContent = "Não foi possível carregar os produtos. Tente novamente mais tarde.";
	}
}

function montarCategorias(produtos) {
	var categorias = [];

	for (var i = 0; i < produtos.length; i++) {
		var cat = produtos[i].category;
		if (categorias.indexOf(cat) === -1) {
			categorias.push(cat);
		}
	}

	for (var j = 0; j < categorias.length; j++) {
		var opcao = document.createElement("option");
		opcao.value = categorias[j];
		opcao.textContent = categorias[j];
		elCategoria.appendChild(opcao);
	}
}

function mostrarProdutos(produtos) {
	elGrade.innerHTML = "";

	if (produtos.length === 0) {
		elStatus.textContent = "Nenhum resultado encontrado.";
		return;
	}

	elStatus.textContent = "";

	for (var i = 0; i < produtos.length; i++) {
		var produto = produtos[i];

		var card = document.createElement("div");
		card.className = "card-produto";

		var img = document.createElement("img");
		img.src = produto.thumbnail;
		img.alt = produto.title;

		var titulo = document.createElement("h3");
		titulo.textContent = produto.title;

		var categoria = document.createElement("div");
		categoria.className = "categoria";
		categoria.textContent = produto.category;

		var preco = document.createElement("div");
		preco.className = "preco";
		preco.textContent = "$ " + produto.price.toFixed(2);

		var botao = document.createElement("button");
		botao.textContent = "Adicionar ao carrinho";
		botao.onclick = function() {
			alert("Produto adicionado ao carrinho!");
		};

		card.appendChild(img);
		card.appendChild(titulo);
		card.appendChild(categoria);
		card.appendChild(preco);
		card.appendChild(botao);

		elGrade.appendChild(card);
	}
}

function filtrarProdutos() {
	var termo = elBusca.value.toLowerCase();
	var categoriaEscolhida = elCategoria.value;

	var resultado = listaProdutos.filter(function(produto) {
		var nomeCombina = produto.title.toLowerCase().indexOf(termo) !== -1;
		var categoriaCombina = categoriaEscolhida === "todas" || produto.category === categoriaEscolhida;
		return nomeCombina && categoriaCombina;
	});

	mostrarProdutos(resultado);
}

elBotaoBuscar.addEventListener("click", filtrarProdutos);

elCategoria.addEventListener("change", filtrarProdutos);

elBusca.addEventListener("keyup", function(evento) {
	if (evento.key === "Enter") {
		filtrarProdutos();
	}
});

elBotaoLimpar.addEventListener("click", function() {
	elBusca.value = "";
	elCategoria.value = "todas";
	mostrarProdutos(listaProdutos);
});

carregarProdutos();

</script>

</body>
</html>
